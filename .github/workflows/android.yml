name: Build Android APK

# 触发方式：
#   1) 推送到 main / master 自动构建
#   2) 在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK（ANDROID_HOME 已就绪、许可已接受）。
      # 不再使用 android-actions/setup-android@v3 —— 该 action 在新镜像上会失败。
      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept SDK licenses and ensure packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "sdkmanager 不在 PATH，跳过；镜像自带 SDK 通常已接受许可"
          fi

      - name: Install npm dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      # 关键：固定调试签名。
      # 云端 runner 每次都是全新环境，若不固定，每次构建会生成不同的签名证书，
      # 新 APK 覆盖安装会报「签名不一致」，只能卸载重装 —— 本地数据会一起丢失。
      - name: Use fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp keystore/wb-debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | head -5

      - name: Add or sync Android platform
        working-directory: app
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            npx cap sync android
          fi
          npx cap copy android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh app/android/app/build/outputs/apk/debug/
          du -h app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
